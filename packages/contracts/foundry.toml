[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
via_ir = false
fs_permissions = []

[profile.default.fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
